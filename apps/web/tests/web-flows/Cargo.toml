[package]
name = "jeryu-web-flows"
version = "0.1.0"
edition = "2024"
publish = false

[dev-dependencies]
futures-util = "0.3"
serde_json = "1"
thirtyfour = { version = "=0.37.5", default-features = false, features = ["reqwest", "rustls"] }
tiny_http = "=0.12.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
