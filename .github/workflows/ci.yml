name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

env:
  # Enable the network-dependent dependency-advisory scans (npm audit / cargo
  # deny) in the security lane. The forge required-check runs them ungated too.
  JERYU_SECURITY_NETWORK: "1"
  # BEGIN GENERATED JANKURAI WORKFLOW PIN — DO NOT EDIT
  # No Jankurai identity is pinned here; see ops/ci/lib.sh require_jankurai.
  # END GENERATED JANKURAI WORKFLOW PIN

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      # cache: Cargo and npm dependency caches are provided by the runner image when available.
      - name: Ensure pinned jankurai
        run: bash ops/ci/ensure-jankurai.sh
      - name: PR CI (canonical gate)
        run: bash ops/ci/pr-ci.sh
      - name: Proof evidence lane
        run: bash ops/ci/proof_evidence.sh
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-audit-artifacts
          path: |
            .jankurai/
            target/jankurai/
            target/jankurai/coverage/coverage-audit.md
            target/jankurai/coverage/coverage-audit.json
            target/jankurai/vibe-coverage.md
            target/jankurai/vibe-coverage.json
            target/jankurai/migration-report.json
            target/jankurai/ux-qa.json
            target/jankurai/ux-qa/
            target/jankurai/rust/witness-graph.json
            target/jankurai/language-bad-behavior.log
            target/jankurai/copy-code.md
            target/jankurai/copy-code.json
            target/jankurai/proofmark/proof-receipt.json
            target/jankurai/proofmark/proofmark-receipt.json
            target/jankurai/proofbind/obligations.json
            target/jankurai/proofbind/surface-witness.json
            target/jankurai/security/evidence.json
            target/jankurai/e2e/
            target/jankurai/repair-queue.jsonl
            target/jankurai/repo-score.md
            target/jankurai/repo-score.json
            .jankurai/repo-score.md
            .jankurai/repo-score.json
            target/artifact-support/
            apps/web/playwright-report/
            apps/web/test-results/
            apps/web/storybook-static/
          if-no-files-found: ignore

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm
      - name: Frontend checks
        run: bash ops/ci/frontend-checks.sh
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-evidence
          path: |
            target/web-flows/*.json
            target/web-flows/*.png
            target/web-flows/*.html
            target/web-flows/*.log
            apps/web/coverage/coverage-summary.json
            apps/web/playwright-report/
            apps/web/test-results/
            target/jankurai/ux-qa.json
            target/jankurai/ux-qa/
            target/security/
          if-no-files-found: error

  web-flows:
    name: Rust public web flows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
          cache: npm
      - name: Use Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
      - name: Cache Rust dependencies and matched browser pair
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/web-flows/cargo
            target/web-flows/browser
          key: web-flows-${{ runner.os }}-1.95.0-${{ hashFiles('apps/web/tests/web-flows/Cargo.lock', 'ops/ci/web-flows.sh') }}
      - name: Production build and Rust browser journey
        run: |
          npm ci
          npm --workspace @jeryu/web run build
          bash ops/ci/web-flows.sh
      - name: Upload Rust flow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-web-flow-evidence
          path: |
            target/web-flows/*.json
            target/web-flows/*.png
            target/web-flows/*.html
            target/web-flows/*.log
          if-no-files-found: error
