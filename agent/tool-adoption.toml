schema_version = "1.0.0"
# `auto` = a named lane runs it for real in CI. `disabled` = not run; reason given.

[[tools]]
id = "audit-ci" # ops/ci/score.sh and ops/ci/proof_evidence.sh run the full audit with the repo policy
mode = "auto"

[[tools]]
id = "proof-routing" # no lane runs jankurai proof routing here
mode = "disabled"

[[tools]]
id = "proofbind" # ops/ci/proof_evidence.sh runs proofbind verify against origin/main
mode = "auto"

[[tools]]
id = "proofmark-rust" # no Rust crates in this repo
mode = "disabled"

[[tools]]
id = "copy-code" # ops/ci/proof_evidence.sh runs copy-code
mode = "auto"

[[tools]]
id = "security" # ops/ci/proof_evidence.sh runs jankurai security run
mode = "auto"

[[tools]]
id = "ci-bad-behavior" # its CI command is jankurai's own test suite; not runnable here
mode = "disabled"

[[tools]]
id = "git-bad-behavior" # its CI command is jankurai's own test suite; not runnable here
mode = "disabled"

[[tools]]
id = "release-bad-behavior" # its CI command is jankurai's own test suite; not runnable here
mode = "disabled"

[[tools]]
id = "ux-qa" # no agent/ux-qa.toml; the web ux-qa npm lane is not jankurai ux audit
mode = "disabled"

[[tools]]
id = "db-migration-analyze" # ops/ci/proof_evidence.sh analyzes db/migrations
mode = "auto"

[[tools]]
id = "contract-drift" # no lane runs jankurai contract-drift
mode = "disabled"

[[tools]]
id = "rust-witness" # no Rust crates in this repo
mode = "disabled"

[[tools]]
id = "coverage-evidence" # no agent/coverage-sources.toml
mode = "disabled"

[[tools]]
id = "vibe-coverage" # no agent/vibe-coverage.toml
mode = "disabled"

[[tools]]
id = "input-boundary" # no lane runs it
mode = "disabled"

[[tools]]
id = "authz-matrix" # no lane runs it
mode = "disabled"

[[tools]]
id = "agent-tool-supply" # no lane runs it
mode = "disabled"

[[tools]]
id = "release-readiness" # no lane runs it
mode = "disabled"

[[tools]]
id = "cost-budget" # no lane runs it
mode = "disabled"
